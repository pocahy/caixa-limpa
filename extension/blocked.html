<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Em foco · Caixa Limpa</title>
<link rel="stylesheet" href="ui.css">
<style>
body{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.box{max-width:440px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:28px;letter-spacing:-.02em}
.clock{font-family:var(--f-mono);font-size:64px;line-height:1;color:var(--accent)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="box">
  <span class="lbl">Caixa Limpa · Pomodoro</span>
  <h1>Você está em foco</h1>
  <div class="clock mono" id="clock">--:--</div>
  <p class="muted" id="task" style="margin:0">Este site fica bloqueado até o fim do pomodoro.</p>
  <div class="acts">
    <button class="btn primary" id="back" type="button">Voltar ao trabalho</button>
    <button class="btn ghost" id="pause" type="button">Pausar o foco</button>
  </div>
</div>
<script type="module" src="blocked.js"></script>
</body>
</html>
